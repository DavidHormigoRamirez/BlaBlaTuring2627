{% extends "base.html" %}
{% block content %}
<h1 class="title">Routes</h1>
<table class="table">
    <thead>
        <th>Description</th>
        <th>Active</th>
    </thead>
    <tbody>
        {% for route in object_list %}
            <td>{{ route.description }}</td>
            {% if route.active %}
              <td>Active</td>
            {% else %}
              <td>Inactive</td>
            {% endif %}
            {% empty %}
            <td><h2 class="subtitle">No routes yet.</h2></td>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
