{% extends "base.html" %}
{% block content %}
<section class="section">
  <div class="container">
    <div class="card">
      <header class="card-header">
        <p class="card-header-title">Booking {{ booking.id }}</p>
        <span class="card-header-icon">
          {% if booking.active %}
            <span class="tag is-success">Active</span>
          {% else %}
            <span class="tag is-danger">Inactive</span>
          {% endif %}
        </span>
      </header>
      <div class="card-content">
        <div class="content">
          <p><strong>Reserve hour:</strong> {{ booking.ReserveHour }}</p>
          <p><strong>User:</strong> {{ booking.user }}</p>
          <p><strong>Route:</strong> {{ booking.route }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
