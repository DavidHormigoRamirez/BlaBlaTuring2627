
<h1>Available Parking Spaces</h1>

<ul>
    {% for item in availability %}
        <li>
            {{ item.zone.zone_type }} -
            {{ item.start_time }} to {{ item.end_time }} -
            {{ item.free_spaces }} free spaces
        </li>
    {% empty %}
        <li>No availability records yet.</li>
    {% endfor %}
</ul>
