{% extends "base.html" %}
{% block content%}
<h1 class="title">Incidents</h1>
<ul>
{% for incident in object_list %}
    <li><a href="{% url 'incident-detail' incident.id %}">{{ incident.id }}</a> - {{ incident.subject }}</li>
{% empty %}
    <li>No incidents yet. Thanks :)</li>
{% endfor %}
</ul>
{% endblock %}
